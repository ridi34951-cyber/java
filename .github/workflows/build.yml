name: Build GyroLock Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

tor --version

      - name: Set up Gradle compatible with Android Gradle Plugin 8.7.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Verify build inputs and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/gyrolock_vulkan.cpp
          test -f app/src/main/cpp/fullscreen.vert
          test -f app/src/main/cpp/stabilize.frag
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Compile and validate Vulkan shaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gyrolock-shaders
          glslangValidator -V app/src/main/cpp/fullscreen.vert -o /tmp/gyrolock-shaders/fullscreen.vert.spv
          glslangValidator -V app/src/main/cpp/stabilize.frag -o /tmp/gyrolock-shaders/stabilize.frag.spv
          test -s /tmp/gyrolock-shaders/fullscreen.vert.spv
          test -s /tmp/gyrolock-shaders/stabilize.frag.spv

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify debug APK exists
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-Motion-Photo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GyroLock-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
            **/build/tmp/**
          if-no-files-found: ignore
          retention-days: 14
